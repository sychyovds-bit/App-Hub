<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppHub — Портал приложений</title>
  <meta name="description" content="Коллекция мини-приложений: конвертер валют, заметки, таймду, QR-код, проверка паролей и другое. Работает офлайн.">
  <meta property="og:title" content="AppHub — Портал приложений">
  <meta property="og:description" content="Коллекция мини-приложений: конвертер валют, заметки, таймду, QR-код, проверка паролей и другое. Работает офлайн.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='%237c6cf0'%3E%3Crect x='3' y='3' width='7' height='7' rx='2'/%3E%3Crect x='14' y='3' width='7' height='7' rx='2'/%3E%3Crect x='3' y='14' width='7' height='7' rx='2'/%3E%3Crect x='14' y='14' width='7' height='7' rx='2'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <a href="#main" class="skip-link">Перейти к контенту</a>

  <nav class="sidebar" id="sidebar" aria-label="Основная навигация">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="2"/>
        <rect x="14" y="3" width="7" height="7" rx="2"/>
        <rect x="3" y="14" width="7" height="7" rx="2"/>
        <rect x="14" y="14" width="7" height="7" rx="2"/>
      </svg>
      <span class="logo-text">AppHub</span>
      <button class="sidebar-toggle" id="sidebarToggle" title="Свернуть панель" aria-label="Свернуть панель" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="16" height="16"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      </button>
    </div>

    <div class="search-box">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Поиск..." aria-label="Поиск по приложениям">
    </div>

    <div class="nav-list" id="navList"></div>

    <div class="sidebar-footer">
      <div class="data-actions">
        <button class="data-btn" id="exportBtn" title="Скачать все данные в JSON" aria-label="Экспорт данных">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span class="btn-label">Экспорт</span>
        </button>
        <button class="data-btn" id="importBtn" title="Загрузить данные из JSON" aria-label="Импорт данных">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span class="btn-label">Импорт</span>
        </button>
        <button class="data-btn danger" id="resetBtn" title="Удалить все данные" aria-label="Сброс данных">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
          <span class="btn-label">Сброс</span>
        </button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
      <button class="cloud-btn" id="cloudBtn" title="Синхронизация данных" aria-label="Облачная синхронизация">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z"/></svg>
        <span class="btn-label">Облако</span>
      </button>
      <button class="help-btn" id="helpBtn" title="Горячие клавиши и подсказки" aria-label="Помощь">?</button>
      <button class="theme-toggle" id="themeToggle" title="Переключить тему" aria-label="Переключить тему">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>
      <button class="theme-picker-btn" id="themePicker" title="Цвет темы" aria-label="Выбрать цвет темы" aria-haspopup="menu">
        <span class="swatch-dot"></span>
      </button>
    </div>
  </nav>

  <main class="main" id="main" tabindex="-1">
    <div class="page active" id="page-home">
      <h1>Добро пожаловать</h1>
      <p class="subtitle">Все приложения работают прямо в браузере без установки</p>

      <div id="favoritesSection" hidden>
        <h2 class="section-title">Избранное</h2>
        <div class="grid" id="favGrid"></div>
      </div>

      <div id="recentSection" hidden>
        <div class="section-header">
          <h2 class="section-title">Недавно открытые</h2>
          <button class="clear-btn" id="clearRecentBtn" title="Очистить историю">Очистить</button>
        </div>
        <div class="grid" id="recentGrid"></div>
      </div>

      <h2 class="section-title" id="allAppsTitle">Все приложения</h2>
      <div class="chip-row" id="categoryChips"></div>
      <div id="appSections"></div>
      <div class="empty-state" id="emptyState" hidden>
        <svg viewBox="0 0 24 24" width="48" height="48">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <p>Ничего не найдено</p>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <button class="modal-close" id="modalClose" aria-label="Закрыть">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script type="module" src="core/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
