<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppHub — Портал приложений</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <nav class="sidebar" id="sidebar">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="26" height="26">
        <rect x="3" y="3" width="7" height="7" rx="2"/>
        <rect x="14" y="3" width="7" height="7" rx="2"/>
        <rect x="3" y="14" width="7" height="7" rx="2"/>
        <rect x="14" y="14" width="7" height="7" rx="2"/>
      </svg>
      <span>AppHub</span>
    </div>

    <div class="search-box">
      <svg viewBox="0 0 24 24" width="16" height="16">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Поиск...">
    </div>

    <div class="nav-list" id="navList"></div>

    <div class="sidebar-footer">
      <button class="theme-toggle" id="themeToggle" title="Переключить тему">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>
    </div>
  </nav>

  <main class="main" id="main">
    <div class="page active" id="page-home">
      <h1>Добро пожаловать</h1>
      <p class="subtitle">Все приложения работают прямо в браузере без установки</p>

      <div id="favoritesSection" hidden>
        <h2 class="section-title">Избранное</h2>
        <div class="grid" id="favGrid"></div>
      </div>

      <h2 class="section-title" id="allAppsTitle">Все приложения</h2>
      <div class="grid" id="appGrid"></div>
      <div class="empty-state" id="emptyState" hidden>
        <svg viewBox="0 0 24 24" width="48" height="48">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <p>Ничего не найдено</p>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modalBox">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script type="module" src="core/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
